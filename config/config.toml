[app]
name = "Pigeon Chat"
port = 8080
vector_dim = 1024
log_level = "WARN"
secret_key = "${SECRET_KEY}"

[database]
url = "${DATABASE_URL}"
redis_url = "${REDIS_URL}"

[outline]
api_url = ""
display_url = ""
api_token = ""
webhook_secret = "123"
webhook_sign = true

[siliconflow]
api_key = "${SILICONFLOW_API_KEY}"
base_url = "https://api.siliconflow.cn/v1"
embedding_model = "BAAI/bge-m3"
reranker_model = "BAAI/bge-reranker-v2-m3"
base_chat_model = "Qwen/Qwen3-Next-80B-A3B-Instruct"

[models]
beta_authorized_user_ids = []
custom_openai_model_id = "custom-openai"
custom_openai_display_name = "自定义 OpenAI"
custom_openai_icon = "/chat/static/img/openai.svg"
custom_openai_default_temp = 0.7
custom_openai_default_top_p = 1.0

[[models.chat_presets]]
id = "deepseek-ai/DeepSeek-V3.2"
